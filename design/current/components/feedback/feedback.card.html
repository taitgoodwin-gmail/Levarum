<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css">
<style>body{margin:0;padding:18px;background:var(--lv-page);font-family:var(--lv-f-body)}#root{display:flex;flex-direction:column;gap:16px}</style>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
</head><body>
<div id="root"></div>
<script type="text/babel">
const { Accordion, Alert, StatCard, Button } = window.LevarumDesignSystem_13e0fb;
function Demo(){
  return (
    <>
      <div style={{display:'grid',gridTemplateColumns:'repeat(4,1fr)',gap:10}}>
        <StatCard value="3" label="New" tone="new" />
        <StatCard value="2" label="Contacted" tone="contacted" />
        <StatCard value="1" label="Booked" tone="booked" />
        <StatCard value="7" label="Done" tone="done" />
      </div>
      <Accordion items={[
        { q: 'What does it cost?', a: 'Priced per build, not per hour of meetings, and never open-ended. Your plan is free and shows the work in hours and days.' },
        { q: 'Will this replace my staff?', a: 'No, and I will say so if that is what you are hoping for.' },
      ]} />
      <Alert>Pick at least one, even if none of them is perfect.</Alert>
      <Alert tone="accent">That is not the demo user or password.</Alert>
      <div style={{background:'var(--lv-dark-petrol)',borderRadius:'var(--lv-r-card)',padding:16}}>
        <Alert tone="failure" title="That did not go through."
          actions={<><Button size="sm">Try again</Button><Button size="sm" variant="ghost" style={{borderColor:'var(--lv-alert-btn-line)',color:'var(--lv-alert-ink)'}}>Email us instead</Button></>}>
          Your plan is still on screen and your answers are saved on this device.
        </Alert>
      </div>
    </>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<Demo />);
</script>
</body></html>
