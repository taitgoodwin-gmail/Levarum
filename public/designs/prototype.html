<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>Levarum · Interactive prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@500;600;700;800&family=Instrument+Sans:ital,wght@0,400;0,500;0,600;1,400;1,500&display=swap" rel="stylesheet">
<style>
  *{ box-sizing:border-box; }
  body{ margin:0; -webkit-font-smoothing:antialiased; }
  :root{ --spark:#D4622A; --spark-deep:#B5511F; --mb:22px; }
  input[type=range]{ -webkit-appearance:none; appearance:none; background:transparent; }
  input[type=range]::-webkit-slider-runnable-track{ height:4px; border-radius:3px; background:#E9E6E1; }
  input[type=range]::-webkit-slider-thumb{ -webkit-appearance:none; appearance:none; width:26px; height:26px; border-radius:50%; background:#1A1A1A; margin-top:-11px; cursor:pointer; box-shadow:0 1px 3px rgba(26,26,26,.3); }
  input[type=range]::-moz-range-track{ height:4px; border-radius:3px; background:#E9E6E1; }
  input[type=range]::-moz-range-thumb{ width:26px; height:26px; border:none; border-radius:50%; background:#1A1A1A; cursor:pointer; }
  input.ml-text{ font-family:'Instrument Sans',sans-serif; }
  input.ml-text::placeholder{ color:#9a948c; }
</style>
<link rel="stylesheet" href="/designs/gallery.css"></head><body><header class="gallery-bar"><a href="/designs/">← All designs</a><strong>Interactive prototype</strong><a href="/">Live site ↗</a></header><nav id="screens" aria-label="Preview screens"></nav><details class="tweaks"><summary>Design controls</summary><label>Spark <select id="spark"><option value="ember">Ember</option><option value="blue">Blue</option><option value="forest">Forest</option><option value="violet">Violet</option></select></label><label>Voice <select id="voice"><option>plain</option><option>punchy</option></select></label><label>Density <select id="density"><option>calm</option><option>compact</option></select></label></details><aside class="gallery-note">Design preview only. Sample figures, simulated booking and sign-in. No real leads, emails, or appointments are created.</aside><main id="design-root"></main><template id="design-template">

<div ref="{{ rootRef }}" style="min-height:100vh; box-sizing:border-box; padding:48px 24px 90px; background:#E4E0DA; font-family:'Instrument Sans',sans-serif; display:flex; flex-direction:column; align-items:center; gap:22px;">

  <!-- poster -->
  <div style="width:430px; max-width:100%;">
    <div style="display:flex; align-items:center; gap:10px; margin-bottom:12px;">
      <span style="width:13px; height:13px; background:var(--spark); border-radius:3px; display:inline-block;"></span>
      <span style="font-family:'Schibsted Grotesk',sans-serif; font-weight:700; font-size:17px; letter-spacing:-0.015em; color:#1A1A1A;">Levarum</span>
      <span style="margin-left:auto; font-size:12px; font-weight:600; letter-spacing:0.06em; color:#5C5A56; border:1px solid #d8d3cc; border-radius:7px; padding:4px 9px;">CLICKABLE PROTOTYPE</span>
    </div>
    <div style="font-family:'Schibsted Grotesk',sans-serif; font-weight:800; font-size:26px; letter-spacing:-0.015em; line-height:1.1; color:#1A1A1A;">Game Plan, end to end</div>
    <div style="font-size:15px; line-height:1.55; color:#5C5A56; margin-top:8px;">Prefilled with demo answers, so you can tap straight through. Typing still works. All state is in memory. Nothing is sent anywhere.</div>
  </div>

  <!-- PHONE -->
  <div style="width:390px; max-width:100%; background:#FFFFFF; border:1px solid #E9E6E1; border-radius:34px; box-shadow:0 24px 60px rgba(26,26,26,.13); overflow:hidden;">
    <!-- status bar -->
    <div style="display:flex; align-items:center; justify-content:space-between; padding:14px 26px 4px;"><span style="font-family:'Schibsted Grotesk',sans-serif; font-size:14px; font-weight:600; color:#1A1A1A;">9:41</span><span style="width:18px; height:11px; border:1px solid #1A1A1A; border-radius:2px; opacity:.5; display:inline-block;"></span></div>

    <!-- ===================== DOOR ===================== -->
    <sc-if value="{{ isDoor }}" hint-placeholder-val="{{ true }}">
      <div style="padding:18px 22px 26px;">
        <div style="display:flex; align-items:center; gap:9px; margin-bottom:38px;"><span style="width:13px; height:13px; background:var(--spark); border-radius:3px; display:inline-block;"></span><span style="font-family:'Schibsted Grotesk',sans-serif; font-weight:700; font-size:17px; letter-spacing:-0.015em; color:#1A1A1A;">Levarum</span></div>
        <div style="font-family:'Schibsted Grotesk',sans-serif; font-weight:800; font-size:31px; letter-spacing:-0.02em; line-height:1.08; color:#1A1A1A; margin-bottom:14px;">{{ cDoorH }}</div>
        <div style="font-size:17px; line-height:1.6; color:#5C5A56; margin-bottom:30px;">{{ cDoorSub }}</div>
        <div onClick="{{ start }}" style="min-height:56px; border-radius:14px; background:#1A1A1A; color:#fff; display:flex; align-items:center; justify-content:center; font-family:'Schibsted Grotesk',sans-serif; font-weight:600; font-size:18px; letter-spacing:-0.01em; cursor:pointer; margin-bottom:14px;">{{ cDoorCta }}</div>
        <div style="font-size:14px; color:#5C5A56; text-align:center; margin-bottom:40px;">About 90 seconds. No account, no card.</div>
        <div style="height:1px; background:#E9E6E1; margin-bottom:20px;"></div>
        <div style="display:flex; align-items:center; justify-content:space-between; gap:12px;">
          <span style="font-size:14px; color:#5C5A56; line-height:1.4;">On the Levarum team?</span>
          <span onClick="{{ goOpLogin }}" style="font-size:14px; font-weight:600; color:var(--spark-deep); cursor:pointer; white-space:nowrap;">Operator log in →</span>
        </div>
      </div>
    </sc-if>

    <!-- ===================== STEP 1 ===================== -->
    <sc-if value="{{ isStep1 }}" hint-placeholder-val="{{ false }}">
      <div style="padding:8px 22px 26px;">
        <div style="display:flex; align-items:center; justify-content:space-between; margin-bottom:16px;"><span onClick="{{ goDoor }}" style="font-size:22px; color:#1A1A1A; cursor:pointer; width:30px;">‹</span><span style="font-family:'Schibsted Grotesk',sans-serif; font-weight:700; font-size:16px; letter-spacing:-0.015em; color:#1A1A1A;">Levarum</span><span style="font-size:13px; color:#5C5A56; width:60px; text-align:right;">Step 1 of 3</span></div>
        <div style="display:flex; gap:6px; margin-bottom:24px;"><span style="height:5px; flex:1; border-radius:3px; background:var(--spark);"></span><span style="height:5px; flex:1; border-radius:3px; background:#E9E6E1;"></span><span style="height:5px; flex:1; border-radius:3px; background:#E9E6E1;"></span></div>
        <div style="font-family:'Schibsted Grotesk',sans-serif; font-weight:700; font-size:27px; letter-spacing:-0.015em; line-height:1.08; color:#1A1A1A; margin-bottom:var(--mb);">{{ cS1 }}</div>

        <div style="font-size:15px; font-weight:500; color:#1A1A1A; margin-bottom:9px;">What kind of business is this?</div>
        <div onClick="{{ toggleBt }}" style="min-height:50px; border:1px solid #E9E6E1; border-radius:12px; background:#FBF6F2; display:flex; align-items:center; justify-content:space-between; padding:0 16px; font-size:16px; color:#1A1A1A; cursor:pointer;">{{ businessType }}<span style="font-size:13px; color:#5C5A56;">▾</span></div>
        <sc-if value="{{ btOpen }}" hint-placeholder-val="{{ false }}">
          <div style="border:1px solid #E9E6E1; border-radius:12px; margin-top:8px; overflow:hidden;">
            <sc-for list="{{ businessOptions }}" as="opt" hint-placeholder-count="4">
              <div onClick="{{ opt.onClick }}" style="{{ opt.style }}">{{ opt.label }}</div>
            </sc-for>
          </div>
        </sc-if>

        <div style="font-size:15px; font-weight:500; color:#1A1A1A; margin:22px 0 9px;">About how many hours a week go to back-office work?</div>
        <div style="display:grid; grid-template-columns:1fr 1fr; gap:9px; margin-bottom:26px;">
          <sc-for list="{{ hoursChips }}" as="opt" hint-placeholder-count="4">
            <div onClick="{{ opt.onClick }}" style="{{ opt.style }}">
              <sc-if value="{{ opt.selected }}" hint-placeholder-val="{{ false }}"><span style="width:16px;height:16px;border-radius:50%;background:#1A1A1A;color:#fff;display:flex;align-items:center;justify-content:center;font-size:12px;">✓</span></sc-if>
              {{ opt.label }}
            </div>
          </sc-for>
        </div>

        <div onClick="{{ goStep2 }}" style="min-height:54px; border-radius:13px; background:#1A1A1A; color:#fff; display:flex; align-items:center; justify-content:center; font-family:'Schibsted Grotesk',sans-serif; font-weight:600; font-size:17px; letter-spacing:-0.01em; cursor:pointer; margin-bottom:12px;">Next</div>
        <div style="font-size:14px; color:#5C5A56; text-align:center;">About 90 seconds. No account, no card.</div>
      </div>
    </sc-if>

    <!-- ===================== STEP 2 ===================== -->
    <sc-if value="{{ isStep2 }}" hint-placeholder-val="{{ false }}">
      <div style="padding:8px 22px 26px;">
        <div style="display:flex; align-items:center; justify-content:space-between; margin-bottom:16px;"><span onClick="{{ goStep1 }}" style="font-size:22px; color:#1A1A1A; cursor:pointer; width:30px;">‹</span><span style="font-family:'Schibsted Grotesk',sans-serif; font-weight:700; font-size:16px; letter-spacing:-0.015em; color:#1A1A1A;">Levarum</span><span style="font-size:13px; color:#5C5A56; width:60px; text-align:right;">Step 2 of 3</span></div>
        <div style="display:flex; gap:6px; margin-bottom:24px;"><span style="height:5px; flex:1; border-radius:3px; background:var(--spark);"></span><span style="height:5px; flex:1; border-radius:3px; background:var(--spark);"></span><span style="height:5px; flex:1; border-radius:3px; background:#E9E6E1;"></span></div>
        <div style="font-family:'Schibsted Grotesk',sans-serif; font-weight:700; font-size:27px; letter-spacing:-0.015em; line-height:1.08; color:#1A1A1A; margin-bottom:8px;">{{ cS2 }}</div>
        <div style="font-size:16px; color:#5C5A56; line-height:1.5; margin-bottom:20px;">Pick the ones that sound like you. More than one is fine.</div>
        <div style="display:flex; flex-direction:column; gap:10px; margin-bottom:24px;">
          <sc-for list="{{ painRows }}" as="row" hint-placeholder-count="5">
            <div onClick="{{ row.onClick }}" style="{{ row.rowStyle }}">
              <span style="{{ row.boxStyle }}"><sc-if value="{{ row.selected }}" hint-placeholder-val="{{ false }}">✓</sc-if></span>
              <span style="{{ row.textStyle }}">{{ row.label }}</span>
            </div>
          </sc-for>
        </div>
        <div onClick="{{ goStep3 }}" style="min-height:54px; border-radius:13px; background:#1A1A1A; color:#fff; display:flex; align-items:center; justify-content:center; font-family:'Schibsted Grotesk',sans-serif; font-weight:600; font-size:17px; letter-spacing:-0.01em; cursor:pointer;">Next</div>
      </div>
    </sc-if>

    <!-- ===================== STEP 3 ===================== -->
    <sc-if value="{{ isStep3 }}" hint-placeholder-val="{{ false }}">
      <div style="padding:8px 22px 26px;">
        <div style="display:flex; align-items:center; justify-content:space-between; margin-bottom:16px;"><span onClick="{{ goStep2 }}" style="font-size:22px; color:#1A1A1A; cursor:pointer; width:30px;">‹</span><span style="font-family:'Schibsted Grotesk',sans-serif; font-weight:700; font-size:16px; letter-spacing:-0.015em; color:#1A1A1A;">Levarum</span><span style="font-size:13px; color:#5C5A56; width:60px; text-align:right;">Step 3 of 3</span></div>
        <div style="display:flex; gap:6px; margin-bottom:24px;"><span style="height:5px; flex:1; border-radius:3px; background:var(--spark);"></span><span style="height:5px; flex:1; border-radius:3px; background:var(--spark);"></span><span style="height:5px; flex:1; border-radius:3px; background:var(--spark);"></span></div>
        <div style="font-family:'Schibsted Grotesk',sans-serif; font-weight:700; font-size:27px; letter-spacing:-0.015em; line-height:1.08; color:#1A1A1A; margin-bottom:8px;">{{ cS3 }}</div>
        <div style="font-size:16px; color:#5C5A56; line-height:1.5; margin-bottom:var(--mb);">A short, costed plan. Built from your answers, written in plain language.</div>
        <div style="display:flex; flex-direction:column; gap:16px; margin-bottom:26px;">
          <div style="display:flex; gap:13px;"><span style="width:26px;height:26px;border-radius:50%;border:1.5px solid #1A1A1A;display:flex;align-items:center;justify-content:center;font-family:'Schibsted Grotesk',sans-serif;font-weight:600;font-size:13px;flex:none;color:#1A1A1A;">1</span><span style="font-size:16px; line-height:1.4; color:#1A1A1A;">The handful of jobs worth handing off first</span></div>
          <div style="display:flex; gap:13px;"><span style="width:26px;height:26px;border-radius:50%;border:1.5px solid #1A1A1A;display:flex;align-items:center;justify-content:center;font-family:'Schibsted Grotesk',sans-serif;font-weight:600;font-size:13px;flex:none;color:#1A1A1A;">2</span><span style="font-size:16px; line-height:1.4; color:#1A1A1A;">Roughly how many hours that gives you back each week</span></div>
          <div style="display:flex; gap:13px;"><span style="width:26px;height:26px;border-radius:50%;border:1.5px solid #1A1A1A;display:flex;align-items:center;justify-content:center;font-family:'Schibsted Grotesk',sans-serif;font-weight:600;font-size:13px;flex:none;color:#1A1A1A;">3</span><span style="font-size:16px; line-height:1.4; color:#1A1A1A;">What those hours are worth in money</span></div>
          <div style="display:flex; gap:13px;"><span style="width:26px;height:26px;border-radius:50%;border:1.5px solid #1A1A1A;display:flex;align-items:center;justify-content:center;font-family:'Schibsted Grotesk',sans-serif;font-weight:600;font-size:13px;flex:none;color:#1A1A1A;">4</span><span style="font-size:16px; line-height:1.4; color:#1A1A1A;">The one thing I would fix before anything else</span></div>
        </div>
        <div onClick="{{ goGate }}" style="min-height:54px; border-radius:13px; background:#1A1A1A; color:#fff; display:flex; align-items:center; justify-content:center; font-family:'Schibsted Grotesk',sans-serif; font-weight:600; font-size:17px; letter-spacing:-0.01em; cursor:pointer; margin-bottom:12px;">{{ cBuildCta }}</div>
        <div style="font-size:14px; color:#5C5A56; text-align:center;">Computed on this device, in a moment. Simulated, no server.</div>
      </div>
    </sc-if>

    <!-- ===================== GATE (LOCKED) ===================== -->
    <sc-if value="{{ isGate }}" hint-placeholder-val="{{ false }}">
      <div style="padding:8px 22px 26px;">
        <div style="display:flex; align-items:center; justify-content:space-between; margin-bottom:14px;"><span onClick="{{ goStep3 }}" style="font-size:22px; color:#1A1A1A; cursor:pointer; width:30px;">‹</span><span style="font-family:'Schibsted Grotesk',sans-serif; font-weight:700; font-size:16px; letter-spacing:-0.015em; color:#1A1A1A;">Levarum</span><span style="width:60px;"></span></div>
        <div style="font-family:'Schibsted Grotesk',sans-serif; font-weight:600; font-size:12px; letter-spacing:0.08em; color:var(--spark-deep); margin-bottom:10px;">YOUR GAME PLAN IS READY</div>
        <div style="font-family:'Schibsted Grotesk',sans-serif; font-weight:700; font-size:25px; letter-spacing:-0.015em; line-height:1.12; color:#1A1A1A; margin-bottom:16px;">{{ cGateH }}</div>

        <!-- echo of their inputs -->
        <div style="border:1px solid #E9E6E1; border-radius:14px; padding:15px; margin-bottom:14px;">
          <div style="font-size:12px; font-weight:600; letter-spacing:0.06em; color:#5C5A56; margin-bottom:11px;">WHAT YOU TOLD ME</div>
          <div style="display:flex; justify-content:space-between; gap:12px; margin-bottom:8px;"><span style="font-size:14px; color:#5C5A56;">Business</span><span style="font-size:14px; color:#1A1A1A; font-weight:500; text-align:right; max-width:215px;">{{ businessType }}</span></div>
          <div style="display:flex; justify-content:space-between; gap:12px; margin-bottom:11px;"><span style="font-size:14px; color:#5C5A56;">Back-office</span><span style="font-size:14px; color:#1A1A1A; font-weight:500;">{{ hoursBand }} hrs / week</span></div>
          <div style="display:flex; flex-wrap:wrap; gap:6px;">
            <sc-for list="{{ pickedPainLabels }}" as="p" hint-placeholder-count="3">
              <span style="border:1px solid #E9E6E1; background:#FBF6F2; border-radius:7px; padding:5px 9px; font-size:13px; color:#1A1A1A;">{{ p.label }}</span>
            </sc-for>
          </div>
        </div>

        <!-- magnitude: hours real, money masked -->
        <div style="border:1px solid #E9E6E1; border-radius:16px; padding:18px; margin-bottom:14px;">
          <div style="font-size:14px; color:#5C5A56; margin-bottom:6px;">Hours back, every week</div>
          <div style="font-family:'Schibsted Grotesk',sans-serif; font-weight:700; font-size:30px; letter-spacing:-0.015em; color:#1A1A1A;">{{ hoursLabel }}</div>
        </div>
        <div style="border:1px solid #E9E6E1; border-radius:16px; padding:18px; margin-bottom:var(--mb); background:#FBF6F2;">
          <div style="display:flex; align-items:center; justify-content:space-between; margin-bottom:8px;">
            <span style="font-size:14px; color:#5C5A56;">What that is worth, per month</span>
            <span style="position:relative; display:inline-block; width:18px; height:16px;"><span style="position:absolute; bottom:0; left:0; width:18px; height:11px; background:var(--spark); border-radius:3px;"></span><span style="position:absolute; top:0; left:4px; width:10px; height:9px; border:2px solid var(--spark); border-bottom:none; border-radius:6px 6px 0 0;"></span></span>
          </div>
          <div style="font-family:'Schibsted Grotesk',sans-serif; font-weight:800; font-size:34px; letter-spacing:-0.015em; color:#1A1A1A; filter:blur(9px); user-select:none;">{{ monthlyRange }}</div>
          <div style="font-size:14px; color:#5C5A56; margin-top:10px;">Unlock to see the figure, the math behind it, every opportunity named, and the one thing to fix first.</div>
        </div>

        <!-- gate -->
        <div style="border-top:1px solid #E9E6E1; padding-top:20px;">
          <div style="font-family:'Schibsted Grotesk',sans-serif; font-weight:600; font-size:17px; letter-spacing:-0.01em; color:#1A1A1A; margin-bottom:12px;">Where should I send the full plan?</div>
          <input class="ml-text" type="email" value="{{ email }}" onInput="{{ setEmail }}" placeholder="you@yourbusiness.com" style="width:100%; min-height:52px; border:1px solid #E9E6E1; border-radius:12px; background:#fff; padding:0 16px; font-size:16px; color:#1A1A1A; outline:none; margin-bottom:11px;" />
          <sc-if value="{{ emailError }}" hint-placeholder-val="{{ false }}"><div style="font-size:14px; color:var(--spark-deep); margin-bottom:11px;">That does not look like an email yet. Mind checking it?</div></sc-if>
          <div onClick="{{ tryUnlock }}" style="min-height:54px; border-radius:13px; background:#1A1A1A; color:#fff; display:flex; align-items:center; justify-content:center; font-family:'Schibsted Grotesk',sans-serif; font-weight:600; font-size:17px; letter-spacing:-0.01em; cursor:pointer; margin-bottom:11px;">{{ cUnlockCta }}</div>
          <div style="font-size:13px; color:#5C5A56; text-align:center; line-height:1.5;">Simulated. No email is sent and no list is kept. The booked call is the goal, not the email.</div>
        </div>
      </div>
    </sc-if>

    <!-- ===================== REVEAL (UNLOCKED) ===================== -->
    <sc-if value="{{ isReveal }}" hint-placeholder-val="{{ false }}">
      <div style="padding:8px 22px 26px;">
        <div style="display:flex; align-items:center; justify-content:space-between; margin-bottom:16px;"><span style="font-family:'Schibsted Grotesk',sans-serif; font-weight:700; font-size:16px; letter-spacing:-0.015em; color:#1A1A1A;">Levarum</span><span style="font-size:13px; color:#5C5A56;">Unlocked</span></div>
        <div style="font-family:'Schibsted Grotesk',sans-serif; font-weight:600; font-size:12px; letter-spacing:0.08em; color:var(--spark-deep); margin-bottom:14px;">YOUR GAME PLAN</div>
        <div style="margin-bottom:8px; font-size:15px; color:#5C5A56;">{{ cRevealLabel }}</div>
        <div style="font-family:'Schibsted Grotesk',sans-serif; font-weight:800; font-size:38px; letter-spacing:-0.02em; line-height:1.0; color:var(--spark-deep);">{{ monthlyRange }}</div>
        <div style="font-size:15px; color:#5C5A56; margin:6px 0 12px;">a month</div>
        <div style="width:56px; height:4px; border-radius:3px; background:var(--spark); margin-bottom:14px;"></div>
        <div style="font-size:15px; line-height:1.55; color:#5C5A56; margin-bottom:20px;">Based on <span style="color:#1A1A1A; font-weight:500;">{{ hoursLabel }}</span> a week back, at your rate, across about 4.3 weeks. That is roughly <span style="color:#1A1A1A; font-weight:500;">{{ annualRange }}</span> a year. An estimate, not a quote.</div>

        <div style="border:1px solid #E9E6E1; border-radius:16px; background:#FBF6F2; padding:17px; margin-bottom:var(--mb);">
          <div style="display:flex; align-items:baseline; justify-content:space-between; margin-bottom:12px;">
            <span style="font-size:15px; font-weight:500; color:#1A1A1A;">Your hourly rate</span>
            <span style="font-family:'Schibsted Grotesk',sans-serif; font-weight:700; font-size:20px; letter-spacing:-0.015em; color:#1A1A1A;">{{ rateLabel }} / hr</span>
          </div>
          <input type="range" min="25" max="200" step="5" value="{{ rate }}" onInput="{{ setRate }}" style="width:100%; height:44px;" />
          <div style="font-size:13px; color:#5C5A56; margin-top:6px;">Drag to use your real number. The estimate moves with it.</div>
        </div>

        <div style="font-size:14px; font-weight:500; color:#5C5A56; margin-bottom:11px;">Where it comes from</div>
        <div style="display:flex; flex-direction:column; gap:10px; margin-bottom:var(--mb);">
          <sc-for list="{{ opportunities }}" as="o" hint-placeholder-count="3">
            <div style="border:1px solid #E9E6E1; border-radius:13px; padding:13px 15px;"><div style="font-family:'Schibsted Grotesk',sans-serif; font-weight:600; font-size:16px; letter-spacing:-0.01em; color:#1A1A1A; line-height:1.3; margin-bottom:4px;">{{ o.title }}</div><div style="font-size:14px; color:#5C5A56;">{{ o.hoursText }}</div></div>
          </sc-for>
        </div>

        <div style="border:1.5px solid #1A1A1A; border-radius:16px; padding:16px; margin-bottom:20px;">
          <div style="font-family:'Schibsted Grotesk',sans-serif; font-weight:600; font-size:12px; letter-spacing:0.06em; color:#5C5A56; margin-bottom:8px;">FIX THIS FIRST</div>
          <div style="font-family:'Schibsted Grotesk',sans-serif; font-weight:700; font-size:18px; letter-spacing:-0.015em; color:#1A1A1A; line-height:1.25; margin-bottom:7px;">{{ fixFirstTitle }}</div>
          <div style="font-size:15px; line-height:1.5; color:#5C5A56;">{{ fixFirstWhy }}</div>
        </div>

        <div style="border:1px dashed #d8d3cc; border-radius:13px; padding:13px 15px; margin-bottom:var(--mb); background:#FBF6F2;">
          <div style="font-size:12px; font-weight:500; color:#5C5A56; letter-spacing:0.04em; margin-bottom:6px;">PROOF TO ADD</div>
          <div style="font-size:14px; color:#5C5A56; font-style:italic;">[ stat plus named source ]</div>
        </div>

        <div onClick="{{ goBooking }}" style="min-height:58px; border-radius:14px; background:#1A1A1A; color:#fff; display:flex; align-items:center; justify-content:center; font-family:'Schibsted Grotesk',sans-serif; font-weight:600; font-size:18px; letter-spacing:-0.01em; cursor:pointer; margin-bottom:12px;">{{ cBookCta }}</div>
        <div style="font-size:14px; color:#5C5A56; text-align:center; line-height:1.45;">Fifteen minutes, no pitch. We see together whether this is worth doing.</div>
      </div>
    </sc-if>

    <!-- ===================== BOOKING ===================== -->
    <sc-if value="{{ isBooking }}" hint-placeholder-val="{{ false }}">
      <div style="padding:8px 22px 26px;">
        <div style="display:flex; align-items:center; justify-content:space-between; margin-bottom:16px;"><span onClick="{{ goReveal }}" style="font-size:22px; color:#1A1A1A; cursor:pointer; width:30px;">‹</span><span style="font-family:'Schibsted Grotesk',sans-serif; font-weight:700; font-size:16px; letter-spacing:-0.015em; color:#1A1A1A;">Levarum</span><span style="width:60px;"></span></div>
        <div style="font-family:'Schibsted Grotesk',sans-serif; font-weight:700; font-size:25px; letter-spacing:-0.015em; line-height:1.12; color:#1A1A1A; margin-bottom:8px;">Pick a time that suits you.</div>
        <div style="font-size:16px; color:#5C5A56; line-height:1.5; margin-bottom:8px;">Fifteen minutes, by phone. I will have your plan open in front of me.</div>
        <div style="font-size:13px; color:var(--spark-deep); font-weight:500; margin-bottom:20px;">Simulated scheduler. A real Cal.com or Calendly embed goes here.</div>
        <div style="border:1px dashed #d8d3cc; border-radius:14px; background:#FBF6F2; padding:14px; margin-bottom:18px;">
          <div style="font-size:13px; color:#5C5A56; margin-bottom:12px;">Earliest openings</div>
          <div style="display:flex; flex-direction:column; gap:10px;">
            <sc-for list="{{ slots }}" as="s" hint-placeholder-count="4">
              <div onClick="{{ s.onClick }}" style="min-height:52px; background:#fff; border:1px solid #E9E6E1; border-radius:12px; display:flex; align-items:center; justify-content:space-between; padding:0 16px; cursor:pointer;"><span style="font-size:16px; font-weight:500; color:#1A1A1A;">{{ s.label }}</span><span style="font-size:14px; color:var(--spark-deep); font-weight:600;">Pick →</span></div>
            </sc-for>
          </div>
        </div>
        <div style="font-size:13px; color:#5C5A56; text-align:center;">Sent to {{ email }}</div>
      </div>
    </sc-if>

    <!-- ===================== CONFIRMED ===================== -->
    <sc-if value="{{ isConfirmed }}" hint-placeholder-val="{{ false }}">
      <div style="padding:18px 22px 30px;">
        <div style="display:flex; justify-content:center; margin:24px 0 22px;"><span style="width:64px; height:64px; border-radius:50%; background:#1A1A1A; color:#fff; display:flex; align-items:center; justify-content:center; font-size:30px;">✓</span></div>
        <div style="font-family:'Schibsted Grotesk',sans-serif; font-weight:800; font-size:27px; letter-spacing:-0.015em; line-height:1.1; color:#1A1A1A; text-align:center; margin-bottom:10px;">{{ cConfH }}</div>
        <div style="font-size:16px; color:#5C5A56; line-height:1.55; text-align:center; margin-bottom:24px;">{{ cConfSub }}</div>
        <div style="border:1px solid #E9E6E1; border-radius:16px; padding:18px; margin-bottom:18px;">
          <div style="display:flex; justify-content:space-between; gap:12px; margin-bottom:13px;"><span style="font-size:14px; color:#5C5A56;">When</span><span style="font-size:16px; color:#1A1A1A; font-weight:600; text-align:right;">{{ bookedSlot }}</span></div>
          <div style="display:flex; justify-content:space-between; gap:12px; margin-bottom:13px;"><span style="font-size:14px; color:#5C5A56;">Invite to</span><span style="font-size:15px; color:#1A1A1A; font-weight:500; text-align:right; max-width:220px; word-break:break-all;">{{ email }}</span></div>
          <div style="display:flex; justify-content:space-between; gap:12px;"><span style="font-size:14px; color:#5C5A56;">With</span><span style="font-size:15px; color:#1A1A1A; font-weight:500;">Levarum</span></div>
        </div>
        <div style="border:1px solid #E9E6E1; border-radius:16px; padding:16px; margin-bottom:var(--mb); background:#FBF6F2;">
          <div style="font-family:'Schibsted Grotesk',sans-serif; font-weight:600; font-size:13px; letter-spacing:0.04em; color:#5C5A56; margin-bottom:8px;">ON THE CALL</div>
          <div style="font-size:15px; line-height:1.55; color:#1A1A1A;">We walk your plan together and start with the one thing to fix first: {{ fixFirstTitle }}.</div>
        </div>
        <div onClick="{{ restart }}" style="min-height:52px; border-radius:13px; border:1.5px solid #1A1A1A; color:#1A1A1A; display:flex; align-items:center; justify-content:center; font-family:'Schibsted Grotesk',sans-serif; font-weight:600; font-size:16px; cursor:pointer; margin-bottom:12px;">Run the prototype again</div>
        <div style="font-size:13px; color:var(--spark-deep); font-weight:500; text-align:center;">Simulated confirmation. No invite is actually sent.</div>
      </div>
    </sc-if>

    <!-- ===================== OPERATOR LOGIN (SEPARATE DOOR) ===================== -->
    <sc-if value="{{ isOpLogin }}" hint-placeholder-val="{{ false }}">
      <div style="background:#1A1A1A; margin:0 -1px; padding:30px 24px 34px;">
        <div style="display:flex; align-items:center; gap:9px; margin-bottom:34px;"><span style="width:9px; height:9px; border-radius:50%; background:#B9B6B1; display:inline-block;"></span><span style="font-family:'Schibsted Grotesk',sans-serif; font-weight:700; font-size:16px; letter-spacing:-0.015em; color:#EDE6D6;">Operator Console</span></div>
        <div style="font-family:'Schibsted Grotesk',sans-serif; font-weight:800; font-size:26px; letter-spacing:-0.015em; line-height:1.1; color:#EDE6D6; margin-bottom:10px;">Internal sign in.</div>
        <div style="font-size:15px; color:#B9B6B1; line-height:1.55; margin-bottom:26px;">A separate door from the prospect tool. The console is never reachable from a prospect's flow.</div>
        <div style="font-size:13px; color:#B9B6B1; margin-bottom:8px;">Operator email</div>
        <div style="min-height:50px; border:1px solid #3a3a38; border-radius:12px; background:#242422; display:flex; align-items:center; padding:0 16px; font-size:16px; color:#EDE6D6; margin-bottom:14px;">operator@example.com</div>
        <div style="font-size:13px; color:#B9B6B1; margin-bottom:8px;">Passcode</div>
        <div style="min-height:50px; border:1px solid #3a3a38; border-radius:12px; background:#242422; display:flex; align-items:center; padding:0 16px; font-size:18px; letter-spacing:4px; color:#EDE6D6; margin-bottom:20px;">••••••</div>
        <div onClick="{{ opLogin }}" style="min-height:54px; border-radius:13px; background:var(--spark); color:#fff; display:flex; align-items:center; justify-content:center; font-family:'Schibsted Grotesk',sans-serif; font-weight:600; font-size:17px; letter-spacing:-0.01em; cursor:pointer; margin-bottom:14px;">Sign in</div>
        <div style="display:flex; align-items:center; justify-content:space-between;">
          <span onClick="{{ goDoor }}" style="font-size:14px; color:#B9B6B1; cursor:pointer;">‹ Back</span>
          <span style="font-size:13px; color:#B9B6B1;">Simulated sign in. No real auth.</span>
        </div>
      </div>
    </sc-if>

    <!-- ===================== OPERATOR CONSOLE ===================== -->
    <sc-if value="{{ isConsole }}" hint-placeholder-val="{{ false }}">
      <div>
        <div style="background:#1A1A1A; margin:0 -1px; padding:16px 22px;">
          <div style="display:flex; align-items:center; justify-content:space-between;"><span style="display:flex; align-items:center; gap:9px;"><span style="width:8px;height:8px;border-radius:50%;background:#B9B6B1;display:inline-block;"></span><span style="font-family:'Schibsted Grotesk',sans-serif; font-weight:700; font-size:15px; letter-spacing:-0.015em; color:#EDE6D6;">Operator Console</span></span><span onClick="{{ opSignOut }}" style="font-size:13px; color:#B9B6B1; cursor:pointer;">Sign out</span></div>
          <div style="font-size:13px; color:#B9B6B1; margin-top:5px;">Internal. Not shown to the prospect.</div>
        </div>
        <div style="padding:20px;">
          <div style="border:1px solid #E9E6E1; border-radius:13px; padding:15px; margin-bottom:14px;">
            <div style="font-family:'Schibsted Grotesk',sans-serif; font-weight:600; font-size:12px; letter-spacing:0.06em; color:#5C5A56; margin-bottom:11px;">FROM THE INTAKE</div>
            <div style="display:flex; justify-content:space-between; gap:12px; margin-bottom:8px;"><span style="font-size:14px; color:#5C5A56;">Business</span><span style="font-size:14px; color:#1A1A1A; font-weight:500; text-align:right; max-width:215px;">{{ businessType }}</span></div>
            <div style="display:flex; justify-content:space-between; gap:12px; margin-bottom:8px;"><span style="font-size:14px; color:#5C5A56;">Hours</span><span style="font-size:14px; color:#1A1A1A; font-weight:500;">{{ hoursBand }} / wk</span></div>
            <div style="display:flex; justify-content:space-between; gap:12px;"><span style="font-size:14px; color:#5C5A56;">Named pains</span><span style="font-size:14px; color:#1A1A1A; font-weight:500; text-align:right; max-width:215px;">{{ painsSummary }}</span></div>
          </div>
          <div style="border:1px solid #E9E6E1; border-radius:13px; padding:16px; margin-bottom:14px;">
            <div style="display:flex; align-items:center; gap:8px; margin-bottom:10px;"><span style="width:10px;height:10px;background:var(--spark);border-radius:3px;display:inline-block;"></span><span style="font-family:'Schibsted Grotesk',sans-serif; font-weight:700; font-size:17px; letter-spacing:-0.015em; color:#1A1A1A;">Draft approach</span></div>
            <div style="font-size:15px; line-height:1.55; color:#1A1A1A;">Lead with a shared answer library so the same questions stop landing in the owner's inbox. Then automate invoice send and follow-up. Booking and reminders come once the first pieces are steady. Phase it so each piece earns the next.</div>
          </div>
          <div style="border:1px solid #E9E6E1; border-radius:13px; padding:15px; margin-bottom:14px;">
            <div style="font-family:'Schibsted Grotesk',sans-serif; font-weight:600; font-size:12px; letter-spacing:0.06em; color:#5C5A56; margin-bottom:11px;">BUILDING BLOCKS</div>
            <div style="display:flex; flex-wrap:wrap; gap:7px; margin-bottom:14px;">
              <sc-for list="{{ opBlocks }}" as="b" hint-placeholder-count="3">
                <span style="border:1px solid #E9E6E1; background:#FBF6F2; border-radius:7px; padding:6px 10px; font-size:13px; color:#1A1A1A;">{{ b.label }}</span>
              </sc-for>
            </div>
            <div style="font-family:'Schibsted Grotesk',sans-serif; font-weight:600; font-size:12px; letter-spacing:0.06em; color:#5C5A56; margin-bottom:9px;">MEASURE · DISCOVERY · WATCH-OUTS</div>
            <div style="font-size:14px; line-height:1.55; color:#5C5A56;">Measure hours on repeat questions, days from invoice to paid, and no-shows. Ask who owns each task today and what cannot be automated. Watch that the answer library does not go stale without an owner.</div>
          </div>
          <div style="border:1.5px solid #1A1A1A; border-radius:13px; padding:16px;">
            <div style="font-family:'Schibsted Grotesk',sans-serif; font-weight:600; font-size:12px; letter-spacing:0.06em; color:#5C5A56; margin-bottom:12px;">ROUGH BUILD ESTIMATE</div>
            <div style="display:flex; gap:24px; margin-bottom:12px;">
              <div><div style="font-size:13px; color:#5C5A56; margin-bottom:4px;">Effort</div><div style="font-family:'Schibsted Grotesk',sans-serif; font-weight:700; font-size:20px; letter-spacing:-0.015em; color:#1A1A1A;">{{ estDays }}</div></div>
              <div><div style="font-size:13px; color:#5C5A56; margin-bottom:4px;">Range</div><div style="font-family:'Schibsted Grotesk',sans-serif; font-weight:700; font-size:20px; letter-spacing:-0.015em; color:#1A1A1A;">{{ estRange }}</div></div>
            </div>
            <div style="font-family:'Schibsted Grotesk',sans-serif; font-weight:600; font-size:13px; color:#1A1A1A; margin-bottom:5px;">Your sizing only. Never shown to the prospect.</div>
            <div style="font-size:12px; color:var(--spark-deep); font-weight:500;">Simulated figures, from a placeholder day rate.</div>
          </div>
        </div>
      </div>
    </sc-if>

  </div>

  <!-- harness note -->
  <div style="width:430px; max-width:100%; border:1px solid #d8d3cc; border-radius:14px; background:#FBF6F2; padding:14px 16px;">
    <div style="font-family:'Schibsted Grotesk',sans-serif; font-weight:600; font-size:12px; letter-spacing:0.06em; color:#5C5A56; margin-bottom:7px;">THE BOUNDARY, IN THE PROTOTYPE</div>
    <div style="font-size:14px; line-height:1.55; color:#1A1A1A;">The prospect Game Plan and the Operator Console are reached through different doors. Nothing in the prospect flow links to the console. The console sits behind its own internal sign in. Email, scheduling, sign in, and the AI sizing are all simulated and run on in-memory state.</div>
  </div>

</div>
</template><script type="module" src="/designs/prototype.js"></script></body></html>
